name: Apply order flow fixes

on:
  push:
    branches:
      - fix/menu-back-admin-order-flow
    paths:
      - .github/workflows/apply-order-flow-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-back-admin-order-flow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return updated

          # ─────────────────────────────────────────────────────────────
          # Admin: verified status transitions, real error handling, busy UI
          # ─────────────────────────────────────────────────────────────
          admin_path = Path('client/src/pages/AdminDashboard.tsx')
          admin = admin_path.read_text()

          admin = replace_once(
              admin,
              "  const [sinpeBlockMode, setSinpeBlockMode] = useState<'always' | 'delivery_only' | 'never'>('always');",
              "  const [sinpeBlockMode, setSinpeBlockMode] = useState<'always' | 'delivery_only' | 'never'>('always');\n  const [statusUpdating, setStatusUpdating] = useState<Set<string>>(new Set());",
              'admin statusUpdating state',
          )

          admin = sub_once(
              admin,
              r"  // ── Validar pago SINPE delivery y enviar a cocina en un solo paso ──\n  const handleValidateSinpeDelivery = async \(orderId: string\) => \{.*?\n  \};\n\n  useEffect\(\(\) => \{ fetchOrders\(\); \}, \[fetchOrders\]\);",
              '''  // ── Validar pago SINPE y confirmar que la transición ocurrió realmente ──
  const handleValidateSinpeDelivery = async (orderId: string) => {
    if (statusUpdating.has(orderId)) return;
    setStatusUpdating(prev => new Set(prev).add(orderId));
    try {
      const { data, error } = await supabase.rpc('admin_validate_sinpe_order', {
        p_order_id: orderId,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated || updated.status !== 'en_cocina' || updated.payment_status !== 'paid') {
        throw new Error('La base de datos no confirmó el cambio del pedido');
      }
      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...updated } as Order : o));
      toast.success('✅ Pago SINPE validado — pedido enviado a cocina');
      stopAlarm();
      const order = orders.find(o => o.id === orderId);
      if (order) {
        const customerPhone = (order as any).delivery_phone || order.customer_phone;
        if (customerPhone) {
          const name = order.customer_name || 'Cliente';
          const shortId = String(order.order_number);
          const waMsg = `¡Hola ${name}! Tu pago SINPE fue verificado ✅.\nTu pedido #${shortId} ya está siendo preparado en cocina. 🍳`;
          const waUrl = buildWhatsAppUrl(customerPhone, waMsg);
          if (waUrl) setTimeout(() => window.open(waUrl, '_blank'), 500);
        }
      }
      await fetchOrders();
    } catch (err: any) {
      const message = err?.message || String(err);
      if (message.includes('not_authorized') || message.includes('JWT') || message.includes('not_authenticated')) {
        toast.error('La sesión de administrador venció. Vuelve a iniciar sesión.');
      } else {
        toast.error('No se pudo validar el pago: ' + message);
      }
      console.error('[Admin] validate SINPE failed', err);
      await fetchOrders();
    } finally {
      setStatusUpdating(prev => {
        const next = new Set(prev);
        next.delete(orderId);
        return next;
      });
    }
  };

  useEffect(() => { fetchOrders(); }, [fetchOrders]);''',
              'admin SINPE transition',
          )

          admin = sub_once(
              admin,
              r"  const handleStatusChange = async \(orderId: string, newStatus: string\) => \{.*?\n  \};\n\n  // ── Entregar al Rider:",
              '''  const handleStatusChange = async (orderId: string, newStatus: string) => {
    if (statusUpdating.has(orderId)) return;
    const order = orders.find(o => o.id === orderId);
    const isDeliveryOrder = (order as any)?.delivery_type === 'delivery';
    if (isDeliveryOrder && newStatus === 'entregado') {
      toast.error('Para delivery, usa el botón "Entregar al Rider". Solo el rider completa la entrega.');
      return;
    }

    setStatusUpdating(prev => new Set(prev).add(orderId));
    try {
      const { data, error } = await supabase.rpc('admin_transition_order', {
        p_order_id: orderId,
        p_new_status: newStatus,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated || updated.status !== newStatus) {
        throw new Error(`La base de datos mantuvo el pedido en ${updated?.status || 'estado desconocido'}`);
      }

      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...updated } as Order : o));
      const label = ORDER_STATUS_CONFIG[newStatus]?.label || newStatus;
      toast.success(`✅ ${label}`);
      stopAlarm();
      await fetchOrders();

      if (!order) return;
      const deliveryType = (order as any).delivery_type || 'dine_in';
      if (deliveryType === 'delivery') return;
      const customerPhone = (order as any).delivery_phone || order.customer_phone;
      if (!customerPhone) return;
      const name = order.customer_name || 'Cliente';
      const shortId = String(order.order_number);
      if (newStatus === 'listo' && deliveryType === 'takeout') {
        const waMsg = `¡Buenas noticias ${name}! Tu pedido #${shortId} ya está LISTO 🎉.\nYa puedes pasar por él al local.`;
        const waUrl = buildWhatsAppUrl(customerPhone, waMsg);
        if (waUrl) setTimeout(() => window.open(waUrl, '_blank'), 500);
      }
    } catch (err: any) {
      const message = err?.message || String(err);
      if (message.includes('not_authorized') || message.includes('JWT') || message.includes('not_authenticated')) {
        toast.error('La sesión de administrador venció. Vuelve a iniciar sesión.');
      } else if (message.includes('invalid_transition')) {
        toast.error('El pedido cambió en otro dispositivo. Se actualizará la vista.');
      } else {
        toast.error('No se pudo mover el pedido: ' + message);
      }
      console.error('[Admin] order transition failed', err);
      await fetchOrders();
    } finally {
      setStatusUpdating(prev => {
        const next = new Set(prev);
        next.delete(orderId);
        return next;
      });
    }
  };

  // ── Entregar al Rider:''',
              'admin status transition',
          )

          admin = replace_once(
              admin,
              '''              <button key={action.nextStatus}
                onClick={() => handleStatusChange(order.id, action.nextStatus)}
                className="flex-1 flex items-center justify-center gap-1 py-2 rounded-lg text-xs font-bold transition-all active:scale-[0.97] touch-manipulation"
                style={{ backgroundColor: `${action.color}20`, color: action.color, border: `1px solid ${action.color}40` }}>
                <span>{action.icon}</span> {action.label}
              </button>''',
              '''              <button key={action.nextStatus}
                onClick={() => handleStatusChange(order.id, action.nextStatus)}
                disabled={statusUpdating.has(order.id)}
                className="flex-1 flex items-center justify-center gap-1 py-2 rounded-lg text-xs font-bold transition-all active:scale-[0.97] touch-manipulation disabled:opacity-55 disabled:cursor-wait"
                style={{ backgroundColor: `${action.color}20`, color: action.color, border: `1px solid ${action.color}40` }}>
                {statusUpdating.has(order.id)
                  ? <><Loader2 size={12} className="animate-spin" /> Moviendo...</>
                  : <><span>{action.icon}</span> {action.label}</>}
              </button>''',
              'admin status button',
          )

          admin_path.write_text(admin)

          # ─────────────────────────────────────────────────────────────
          # Staff: real server session and server-verified order actions
          # ─────────────────────────────────────────────────────────────
          staff_path = Path('client/src/pages/StaffDashboard.tsx')
          staff = staff_path.read_text()

          staff = replace_once(
              staff,
              '''  role: string;
  is_active: boolean;
}''',
              '''  role: string;
  is_active: boolean;
  session_token?: string;
  expires_at?: string;
}''',
              'staff interface session fields',
          )

          staff = replace_once(
              staff,
              '''function PinModal({ onConfirm, onCancel, adminPin }: { onConfirm: () => void; onCancel: () => void; adminPin: string }) {''',
              '''function PinModal({ onConfirm, onCancel, adminPin }: { onConfirm: (pin: string) => void; onCancel: () => void; adminPin: string }) {''',
              'pin modal callback type',
          )
          staff = replace_once(staff, "    if (pin === adminPin) { onConfirm(); }", "    if (pin === adminPin) { onConfirm(pin); }", 'pin callback value')

          staff = sub_once(
              staff,
              r"  const handleLogin = async \(\) => \{.*?\n  \};\n\n  return \(",
              '''  const handleLogin = async () => {
    if (!username.trim() || !password.trim()) { setError('Completa todos los campos'); return; }
    setLoading(true);
    setError('');
    try {
      const { data, error: loginError } = await supabase.rpc('staff_login_v2', {
        p_tenant_id: tenant.id,
        p_username: username.trim().toLowerCase(),
        p_password: password,
      });
      if (loginError) throw loginError;
      const member = Array.isArray(data) ? data[0] : data;
      if (!member?.id || !member?.session_token) throw new Error('No se recibió una sesión válida');
      toast.success(`Bienvenido, ${member.name}`);
      onLogin(member as StaffMember);
    } catch (err: any) {
      const message = err?.message || String(err);
      setError(message.includes('invalid_credentials') ? 'Usuario o contraseña incorrectos' : 'No se pudo iniciar sesión');
      console.error('[Staff] login failed', err);
    } finally {
      setLoading(false);
    }
  };

  return (''',
              'staff login RPC',
          )

          staff = replace_once(
              staff,
              "  const prevCountRef = useRef(0);",
              "  const prevCountRef = useRef(0);\n  const [advancingOrderId, setAdvancingOrderId] = useState<string | null>(null);",
              'staff busy state',
          )

          staff = replace_once(
              staff,
              '''  const ACTIVE_STATUSES = ['pendiente', 'en_cocina', 'listo', 'entregado'];

  const handleMarkPaid = async (orderId: string, paymentMethod?: string) => {
    const payload: Record<string, string> = { payment_status: 'paid', handled_by: staff.id, handled_by_name: staff.name };
    if (paymentMethod) payload.payment_method = paymentMethod;
    await supabase.from('orders').update(payload).eq('id', orderId);
    setStaffPayModal(null);
    fetchOrders();
    toast.success('Cobro registrado');
  };''',
              '''  const ACTIVE_STATUSES = ['pendiente', 'en_cocina', 'listo', 'entregado'];

  const handleStaffRpcFailure = (err: any, fallback: string) => {
    const message = err?.message || String(err);
    if (message.includes('staff_session_invalid')) {
      toast.error('La sesión del personal venció. Ingresa nuevamente.');
      onLogout();
      return;
    }
    toast.error(`${fallback}: ${message}`);
  };

  const handleMarkPaid = async (orderId: string, paymentMethod?: string) => {
    if (!staff.session_token) { onLogout(); return; }
    try {
      const { data, error } = await supabase.rpc('staff_mark_order_paid', {
        p_session_token: staff.session_token,
        p_order_id: orderId,
        p_payment_method: paymentMethod || null,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated || updated.payment_status !== 'paid') throw new Error('El cobro no fue confirmado por la base de datos');
      setStaffPayModal(null);
      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...updated } : o));
      toast.success('Cobro registrado');
      await fetchOrders();
    } catch (err: any) {
      handleStaffRpcFailure(err, 'No se pudo registrar el cobro');
    }
  };''',
              'staff mark paid RPC',
          )

          staff = replace_once(
              staff,
              '''        const nextStatus = enablePrepStep ? 'en_cocina' : 'listo';
        const now = new Date().toISOString();
        await Promise.all(pendingOrders.map(o =>
          supabase.from('orders').update({
            status: nextStatus,
            accepted_at: now,
            claimed_by_staff_id: null,
            claimed_by_name: 'Auto',
            claimed_at: now,
            ...(nextStatus === 'listo' ? { ready_at: now } : {}),
          }).eq('id', o.id)
        ));''',
              '''        const nextStatus = enablePrepStep ? 'en_cocina' : 'listo';
        if (!staff.session_token) { onLogout(); return; }
        const results = await Promise.all(pendingOrders.map(o =>
          supabase.rpc('staff_transition_order', {
            p_session_token: staff.session_token,
            p_order_id: o.id,
            p_new_status: nextStatus,
          })
        ));
        const failed = results.find(result => result.error);
        if (failed?.error) {
          handleStaffRpcFailure(failed.error, 'No se pudo avanzar automáticamente un pedido');
          return;
        }''',
              'staff auto advance RPC',
          )
          staff = replace_once(
              staff,
              "  }, [tenant.id, enableNewStep, enablePrepStep]);",
              "  }, [tenant.id, enableNewStep, enablePrepStep, staff.session_token]);",
              'staff fetchOrders dependencies',
          )

          staff = sub_once(
              staff,
              r"  const acknowledgeQuickRequest = async \(\) => \{.*?\n  \};\n\n  // ─── V26.0: Log staff event",
              '''  const acknowledgeQuickRequest = async () => {
    if (!quickRequestAlert || !staff.session_token) return;
    try {
      const { data, error } = await supabase.rpc('staff_ack_quick_request', {
        p_session_token: staff.session_token,
        p_order_id: quickRequestAlert.orderId,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated?.quick_request_seen_by_staff) throw new Error('La solicitud no fue confirmada');
      const orderForLog = orders.find(o => o.id === quickRequestAlert.orderId);
      if (orderForLog) await logStaffEvent('quick_request_attended', orderForLog, { request_type: quickRequestAlert.requestType });
      setQuickRequestAlert(null);
      await fetchOrders();
    } catch (err: any) {
      handleStaffRpcFailure(err, 'No se pudo confirmar la solicitud');
    }
  };

  // ─── V26.0: Log staff event''',
              'staff quick request RPC',
          )

          staff = sub_once(
              staff,
              r"  const handleAdvanceStatus = async \(order: Order\) => \{.*?\n  \};\n\n  const handleCancelWithPin",
              '''  const handleAdvanceStatus = async (order: Order) => {
    if (advancingOrderId || !staff.session_token) return;
    let statusFlow: Record<string, string>;
    if (enablePrepStep) {
      statusFlow = { pendiente: 'en_cocina', en_cocina: 'listo', listo: 'entregado' };
    } else {
      statusFlow = { pendiente: 'listo', listo: 'entregado' };
    }
    const next = statusFlow[order.status];
    if (!next) return;

    setAdvancingOrderId(order.id);
    try {
      const { data, error } = await supabase.rpc('staff_transition_order', {
        p_session_token: staff.session_token,
        p_order_id: order.id,
        p_new_status: next,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated || updated.status !== next) {
        throw new Error(`El pedido continuó en ${updated?.status || 'estado desconocido'}`);
      }
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, ...updated } : o));
      const eventMap: Record<string, string> = { en_cocina: 'order_accepted', listo: 'order_ready', entregado: 'order_delivered' };
      if (eventMap[next]) await logStaffEvent(eventMap[next], order);
      toast.success(`Pedido #${order.order_number} → ${ORDER_STATUS_CONFIG[next as keyof typeof ORDER_STATUS_CONFIG]?.label || next}`);
      await fetchOrders();
    } catch (err: any) {
      handleStaffRpcFailure(err, 'No se pudo mover el pedido');
      await fetchOrders();
    } finally {
      setAdvancingOrderId(null);
    }
  };

  const handleCancelWithPin''',
              'staff status transition RPC',
          )

          staff = sub_once(
              staff,
              r"  const confirmCancel = async \(\) => \{.*?\n  \};",
              '''  const confirmCancel = async (pin: string) => {
    if (!pinModal || !staff.session_token) return;
    try {
      const { data, error } = await supabase.rpc('staff_cancel_order', {
        p_session_token: staff.session_token,
        p_order_id: pinModal.orderId,
        p_admin_pin: pin,
      });
      if (error) throw error;
      const updated = Array.isArray(data) ? data[0] : data;
      if (!updated || updated.status !== 'cancelado') throw new Error('La cancelación no fue confirmada');
      setPinModal(null);
      setOrders(prev => prev.filter(o => o.id !== updated.id));
      toast.success('Pedido cancelado');
      await fetchOrders();
    } catch (err: any) {
      handleStaffRpcFailure(err, 'No se pudo cancelar el pedido');
    }
  };''',
              'staff cancel RPC',
          )

          staff = replace_once(
              staff,
              '''                            <button onClick={() => handleAdvanceStatus(order)}
                              className="flex-1 py-3.5 rounded-xl text-sm font-black transition-all active:scale-95"
                              style={{ background: 'linear-gradient(135deg, #F59E0B, #F97316)', color: '#000', boxShadow: '0 6px 16px rgba(245,158,11,0.35)' }}>
                              {getActionLabel(order.status)}
                            </button>''',
              '''                            <button onClick={() => handleAdvanceStatus(order)}
                              disabled={advancingOrderId === order.id}
                              className="flex-1 py-3.5 rounded-xl text-sm font-black transition-all active:scale-95 disabled:opacity-55 disabled:cursor-wait"
                              style={{ background: 'linear-gradient(135deg, #F59E0B, #F97316)', color: '#000', boxShadow: '0 6px 16px rgba(245,158,11,0.35)' }}>
                              {advancingOrderId === order.id ? 'Moviendo...' : getActionLabel(order.status)}
                            </button>''',
              'staff advance button',
          )

          staff = replace_once(
              staff,
              '''      const stored = localStorage.getItem(`staff_session_${slug}`);
      return stored ? JSON.parse(stored) : null;''',
              '''      const stored = localStorage.getItem(`staff_session_${slug}`);
      if (!stored) return null;
      const parsed = JSON.parse(stored) as StaffMember;
      if (!parsed.session_token) {
        localStorage.removeItem(`staff_session_${slug}`);
        return null;
      }
      return parsed;''',
              'staff stored session validation',
          )

          staff_path.write_text(staff)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: |
          npm run check
          npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/apply-order-flow-fix.yml
          git config user.name "Digital Atlas Automation"
          git config user.email "actions@users.noreply.github.com"
          git add client/src/pages/AdminDashboard.tsx client/src/pages/StaffDashboard.tsx .github/workflows/apply-order-flow-fix.yml
          git commit -m "Fix verified admin and staff order transitions"
          git push origin HEAD:fix/menu-back-admin-order-flow
